auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

# --- AQUÍ ESTABA EL PROBLEMA 1 ---
compactor:
  working_directory: /loki/boltdb-shipper-compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem  # <--- ¡NUEVO! Necesario para borrar logs

# --- AQUÍ ESTABA EL PROBLEMA 2 ---
limits_config:
  retention_period: 720h  # 30 días
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_cache_freshness_per_query: 10m
  split_queries_by_interval: 15m
  allow_structured_metadata: false  # <--- ¡CLAVE! Desactiva la exigencia de TSDB/v13

table_manager:
  retention_deletes_enabled: true
  retention_period: 720h