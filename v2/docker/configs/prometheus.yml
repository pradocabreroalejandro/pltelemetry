# =============================================================================
# PROMETHEUS CONFIGURATION - TUNED FOR STABILITY
# =============================================================================
global:
  scrape_interval: 15s     # Intervalo por defecto
  evaluation_interval: 15s 
  scrape_timeout: 10s      # 🔥 Importante: Damos tiempo si el endpoint es lento

scrape_configs:
  # 1. OTEL Collector
  # Este endpoint puede volverse MUY pesado porque expone métricas de
  # todo el pipeline + métricas convertidas de trazas.
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    scrape_interval: 10s
    scrape_timeout: 8s     # Casi al límite del intervalo para asegurar lectura

  # 2. Woofy Agent (Directo)
  # Raspamos directo para tener datos de Runtime (Go routines, GC) fiables
  - job_name: 'woofy-agent'
    static_configs:
      # host.docker.internal para llegar a tu máquina desde Docker
      - targets: ['host.docker.internal:8080'] 
    scrape_interval: 5s    # Alta frecuencia para pillar picos de CPU/Memoria
    scrape_timeout: 4s
    metrics_path: /metrics