# =============================================================================
# PROMETHEUS CONFIGURATION FOR PLTELEMETRY
# File: prometheus.yml
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # OTEL Collector metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    scrape_interval: 10s
    metrics_path: /metrics

  - job_name: 'woofy-agent'
    static_configs:
      # host.docker.internal apunta a TU máquina desde dentro del contenedor
      - targets: ['host.docker.internal:8080'] 
    scrape_interval: 5s  # Frecuencia alta para ver cambios rápidos
    metrics_path: /metrics