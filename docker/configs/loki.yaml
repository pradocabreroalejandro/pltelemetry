auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # 🔥 Increased timeouts for heavy requests
  http_server_read_timeout: 1m
  http_server_write_timeout: 1m
  grpc_server_max_recv_msg_size: 52428800 # 50MB
  grpc_server_max_send_msg_size: 52428800 # 50MB

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

# Compactor Configuration (Correct, we keep it)
compactor:
  working_directory: /loki/boltdb-shipper-compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

# 🔥 TUNED LIMITS FOR STRESS TEST 🔥
limits_config:
  # Retention (Correct)
  retention_period: 720h 
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  
  # Compatibility (Correct)
  allow_structured_metadata: false 
  
  # 🚀 HERE'S THE TURBO:
  ingestion_rate_mb: 50           # Default is 4MB. Bumped to 50MB/s
  ingestion_burst_size_mb: 100    # Burst allowed up to 100MB
  max_entries_limit_per_query: 50000
  per_stream_rate_limit: 50MB
  per_stream_rate_limit_burst: 100MB
  
  # To avoid errors with long labels in synthetic tests
  max_label_value_length: 2048 
  max_label_name_length: 1024

table_manager:
  retention_deletes_enabled: true
  retention_period: 720h
