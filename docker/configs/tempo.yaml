server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  
  # Log por span desactivado (ahorra CPU)
  log_received_spans:
    enabled: false

# 🔥 CORRECCIÓN FINAL: Formato de overrides simplificado y compatible
overrides:
  # Límites globales para todos los tenants (usando wildcard implícito o global config)
  ingestion_rate_limit_bytes: 100000000      # 100MB/s
  ingestion_burst_size_bytes: 200000000      # 200MB burst
  max_bytes_per_trace: 50000000              # 50MB por traza

ingester:
  trace_idle_period: 10s
  max_block_bytes: 5_000_000
  max_block_duration: 5m

compactor:
  compaction:
    compaction_window: 1h
    max_block_bytes: 100_000_000
    block_retention: 720h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal