# =============================================================================
# PROMETHEUS CONFIGURATION - TUNED FOR STABILITY
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # 1. OTEL Collector
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    scrape_interval: 10s
    scrape_timeout: 8s

  # 2. Woofy Agent (Direct)
  - job_name: 'woofy-agent'
    static_configs:
      - targets: ['host.docker.internal:8085']
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: /metrics

  # 3. Queue Health Plugin
  - job_name: 'queue-health'
    static_configs:
      - targets: ['host.docker.internal:9201']
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    authorization:
      credentials: 'woofy-queue-token-2026'

  # 4. Failover Health Plugin
  - job_name: 'failover-health'
    static_configs:
      - targets: ['host.docker.internal:9202']
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    authorization:
      credentials: 'woofy-failover-token-2026'

  # 5. OTLP Probe Plugin
  - job_name: 'otlp-probe'
    static_configs:
      - targets: ['host.docker.internal:9203']
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    authorization:
      credentials: 'woofy-otlp-probe-token-2026'

  # 6. TNS Listener Health Plugin
  - job_name: 'tns-listener-health'
    static_configs:
      - targets: ['host.docker.internal:9200']
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /metrics
    authorization:
      credentials: 'woofy-tns-token-2026'
