# =============================================================================
# PROMETHEUS CONFIGURATION - TUNED FOR STABILITY
# =============================================================================
global:
  scrape_interval: 15s     # Default interval
  evaluation_interval: 15s 
  scrape_timeout: 10s      # 🔥 Important: Give time if the endpoint is slow

scrape_configs:
  # 1. OTEL Collector
  # This endpoint can become VERY heavy because it exposes metrics from
  # the entire pipeline + metrics converted from traces.
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    scrape_interval: 10s
    scrape_timeout: 8s     # Almost at the interval limit to ensure read

  # 2. Woofy Agent (Direct)
  # Scrape directly to have reliable Runtime data (Go routines, GC).
  # Port 8085: :8080 is taken by another host app, woofy binds 0.0.0.0:8085
  # (config.yaml healthPort). host.containers.internal routes to the host LAN
  # IP, reachable because woofy binds all interfaces.
  - job_name: 'woofy-agent'
    static_configs:
      # host.docker.internal to reach your machine from Docker
      - targets: ['host.containers.internal:8085']
    scrape_interval: 5s    # High frequency to catch CPU/Memory spikes
    scrape_timeout: 4s
    metrics_path: /metrics
