# =============================================================================
# PLTelemetry Master Stack - The "Golden" Version (With Portainer)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 🕵️‍♀️ MONITORIZACIÓN DE DOCKER - Portainer
  # ---------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:latest
    container_name: plt-portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - pltelemetry-network

  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE - Oracle Database
  # ---------------------------------------------------------------------------
  oracle-db:
    image: gvenzl/oracle-free:latest
    container_name: oracle-plt
    hostname: oracle-db
    restart: unless-stopped
    environment:
      - ORACLE_PASSWORD=plt
      - APP_USER=plt
      - APP_USER_PASSWORD=plt
      - ORACLE_DATABASE=FREEPDB1
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - pltelemetry-network
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "plt/plt@//localhost:1521/FREEPDB1", "<<<", "SELECT 1 FROM DUAL;"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ---------------------------------------------------------------------------
  # API REST - Oracle ORDS (Standalone con Jetty)
  # ---------------------------------------------------------------------------
  ords:
    # CAMBIO AQUÍ: Usamos la ruta completa al registro de Oracle
    image: container-registry.oracle.com/database/ords:latest
    container_name: plt-ords
    restart: unless-stopped
    environment:
      - ORACLE_HOST=oracle-db
      - ORACLE_PORT=1521
      - ORACLE_SERVICE=FREEPDB1
      - ORACLE_PWD=plt
      - ORDS_PWD=plt
      - JAVA_OPTS=-Xms512M -Xmx512M
    ports:
      - "8080:8080"
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - pltelemetry-network
    volumes:
      - ords-config:/etc/ords/config
      - ords-secrets:/etc/ords/secrets

  # ---------------------------------------------------------------------------
  # CEREBRO - OpenTelemetry Collector
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: plt-otel-collector
    environment:
      - GOMAXPROCS=8
    # IMPORTANTE: Mapeamos tu fichero otel-collector-config.yaml
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./configs/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP (Tu PL/SQL dispara aquí)
      - "8888:8888" # Self metrics
      - "8889:8889" # Prometheus Exporter
      - "13133:13133" # Health check
      - "55679:55679" # zPages
    depends_on:
      - tempo
      - loki
      - prometheus
    networks:
      - pltelemetry-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # TRAZAS - Tempo
  # ---------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:latest
    container_name: plt-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./configs/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200" # API
      - "4317"      # gRPC interno
    networks:
      - pltelemetry-network
    restart: unless-stopped
    user: "0" # Permisos root para escribir en volumen

  # ---------------------------------------------------------------------------
  # LOGS - Loki
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:latest
    container_name: plt-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./configs/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - pltelemetry-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MÉTRICAS - Prometheus
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: plt-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pltelemetry-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # VISUALIZACIÓN - Grafana
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: plt-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      # Correo (MailHog)
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=mailhog:1025
      - GF_SMTP_SKIP_VERIFY=true
      - GF_SMTP_FROM_ADDRESS=pltelemetry@grafana.local
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3020:3000" # Grafana en puerto 3020
    depends_on:
      - tempo
      - loki
      - prometheus
      - mailhog
    networks:
      - pltelemetry-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # EXTRAS - MailHog
  # ---------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: plt-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - pltelemetry-network
    restart: unless-stopped

# =============================================================================
# VOLUMES & NETWORKS
# =============================================================================
volumes:
  # Portainer (Nuevo - Automático)
  portainer_data:

  # Base de Datos (Manual)
  oracle-data:
    external: true
    name: docker_compose_oracle-data 

  # Observabilidad (Manuales)
  grafana-data:
    external: true
    name: docker_compose_grafana-data

  prometheus-data:
    external: true
    name: docker_compose_prometheus-data

  loki-data:
    external: true
    name: docker_compose_loki-data

  tempo-data:
    external: true
    name: docker_compose_tempo-data

  # ORDS (Nuevos - Automáticos para guardar la config de Jetty/ORDS)
  ords-config:
  ords-secrets:

networks:
  pltelemetry-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16